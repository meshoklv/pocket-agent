# Unsigned compile check for Pocket Agent.
#
# Catches compile errors early. No signing and no secrets are needed.
#
# The optional native engines (Vendor/LlamaBonsai/llama.xcframework and
# Vendor/SDCpp/sdcpp.xcframework) are not in git. On a clean clone the vendor
# packages fall back to stub modules, the app's `#if canImport(...)` guards
# switch those engines off, and the rest of the app builds as usual.

name: Build check

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - ".gitignore"
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  DERIVED_DATA: DerivedData
  XCODE_VERSION: "26.2"
  XCODE_PROJECT: PocketAgent.xcodeproj
  XCODE_SCHEME: PocketAgent

jobs:
  build:
    name: Build (unsigned)
    runs-on: macos-26
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: List installed Xcode versions
        run: ls -1 /Applications | grep -i '^Xcode' || true

      # The version must be quoted, otherwise YAML turns 26.2 into a number.
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "${{ env.XCODE_VERSION }}"

      - name: Print Xcode and Swift versions
        run: |
          xcodebuild -version
          swift --version

      # The .xcodeproj is not in git; it is generated from project.yml.
      - name: Install XcodeGen
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALL_CLEANUP: 1
          HOMEBREW_NO_ANALYTICS: 1
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version

      # Cache downloaded Swift packages and binary artifacts. The key changes
      # whenever project.yml or a vendored Package.swift (URLs, checksums) changes.
      - name: Restore package cache
        id: spm_cache
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ${{ env.DERIVED_DATA }}/SourcePackages
          key: spm-${{ runner.os }}-${{ env.XCODE_VERSION }}-${{ hashFiles('project.yml', 'Vendor/**/Package.swift') }}
          restore-keys: |
            spm-${{ runner.os }}-${{ env.XCODE_VERSION }}-
            spm-${{ runner.os }}-

      - name: Generate Xcode project
        run: |
          xcodegen generate
          ls -la "$XCODE_PROJECT"

      # A separate step so the log shows whether a failure is network/packages or code.
      - name: Resolve packages
        run: |
          set -euo pipefail
          START=$(date +%s)
          xcodebuild -resolvePackageDependencies \
                     -project "$XCODE_PROJECT" \
                     -scheme "$XCODE_SCHEME" \
                     -derivedDataPath "$DERIVED_DATA"
          echo "RESOLVE_SECONDS=$(( $(date +%s) - START ))" >> "$GITHUB_ENV"

      - name: Build (Debug, unsigned)
        run: |
          set -o pipefail
          START=$(date +%s)
          xcodebuild build \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$DERIVED_DATA" \
            -resultBundlePath "$RUNNER_TEMP/BuildResults.xcresult" \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS=""
          echo "BUILD_SECONDS=$(( $(date +%s) - START ))" >> "$GITHUB_ENV"

      - name: Timing summary
        if: always()
        run: |
          {
            echo "## Timing"
            echo ""
            echo "| Step | Seconds |"
            echo "|---|---|"
            echo "| Package resolution | ${RESOLVE_SECONDS:-not reached} |"
            echo "| Build | ${BUILD_SECONDS:-not reached} |"
            echo "| Cache hit | ${{ steps.spm_cache.outputs.cache-hit || 'no' }} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build report (failures only)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-results-${{ github.run_number }}
          path: ${{ runner.temp }}/BuildResults.xcresult
          retention-days: 7
          if-no-files-found: ignore
